[project]
name = "meshtastic-tracker"
version = "0.1.0"
description = "Self-hosted web dashboard for monitoring Meshtastic LoRa mesh networks"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
keywords = ["meshtastic", "lora", "gps", "tracking", "mesh-network", "iot"]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "sqlalchemy>=2.0.0",
    "meshtastic>=2.5.0",
    "python-dotenv>=1.0.0",
]
